; OPcache pour la production : le code ne change pas tant que le conteneur tourne
; (une nouvelle version = une nouvelle image), donc inutile de revérifier les fichiers.
opcache.enable=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; Dev (docker-compose.local.yml, code monté) : PHP_OPCACHE_VALIDATE_TIMESTAMPS=1 pour voir les modifs
opcache.validate_timestamps=${PHP_OPCACHE_VALIDATE_TIMESTAMPS}
opcache.save_comments=1
opcache.jit_buffer_size=64M
opcache.jit=tracing
