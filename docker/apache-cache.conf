# Cache navigateur (et Cloudflare devant Render) des fichiers statiques.
# Sans ces en-têtes, chaque rechargement redemande CSS, JS, polices et images au serveur.

# Vite : le nom de fichier change à chaque build (app-XXXX.js) → cache d'un an, jamais revérifié
<LocationMatch "^/build/">
    Header set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>

# Assets Metronic (noms fixes) : 7 jours ; après un changement, revérifiés au plus tard 7 jours après
<LocationMatch "^/assets/">
    Header set Cache-Control "public, max-age=604800"
</LocationMatch>

# Icônes et images de la racine (favicon…)
<FilesMatch "\.(ico|png|svg|webp|jpg|jpeg|gif|woff2?|ttf)$">
    Header set Cache-Control "public, max-age=604800"
</FilesMatch>

# Compression aussi pour les polices et SVG (CSS, JS et HTML sont déjà compressés par défaut)
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE image/svg+xml application/json font/ttf application/x-font-ttf application/vnd.ms-fontobject
</IfModule>
